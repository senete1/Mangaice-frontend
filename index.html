    <!-- Pre-theme loading script -->
    <script>
        (function() {
            var stored = localStorage.getItem('theme-override');
            var isLight = stored ? stored === 'light' : !window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (isLight) document.documentElement.classList.add('tema-claro');

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                localStorage.removeItem('theme-override');
                if (!e.matches) {
                    document.documentElement.classList.add('tema-claro');
                } else {
                    document.documentElement.classList.remove('tema-claro');
                }
            });
        })();
    </script>
