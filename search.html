<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - Mangaice</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Theme Synchronization Script -->
    <script>
        (function() {
            var stored = localStorage.getItem('theme-override');
            var isLight = stored ? stored === 'light' : !window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (isLight) document.documentElement.classList.add('tema-claro');
        })();
    </script>

    <style>
        :root {
            --accent-blue: #2825b6;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-main, #121216);
            color: var(--text-main, #fff);
            -webkit-tap-highlight-color: transparent;
        }

        html.tema-claro {
            --bg-main: #f4f4f6;
            --header-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: #e2e2e8;
            --text-main: #121216;
            --text-secondary: #555560;
        }

        .container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
            box-sizing: border-box;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--header-bg, #18181c);
            border-bottom: 1px solid var(--border-color, #2a2a35);
            padding: 0.75rem 0;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .search-wrapper-flex {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
            position: relative;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--card-bg, #1e1e24);
            border: 1px solid var(--border-color, #2a2a35);
            border-radius: 8px;
            padding: 0 0.75rem;
            height: 40px;
            flex: 1;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: var(--text-main, #fff);
            font-size: 0.9rem;
            width: 100%;
            outline: none;
        }

        .search-box svg {
            color: var(--text-secondary, #a0a0ab);
            cursor: pointer;
            flex-shrink: 0;
        }

        .filter-toggle-btn {
            background: transparent;
            border: none;
            color: #2825b6;
            padding: 0.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
            height: 40px;
            flex-shrink: 0;
        }

        .filter-toggle-btn:hover { opacity: 0.8; }

        /* DROPDOWN DE TAGS COM BOTÃO FIXO NA BASE */
        .tags-dropdown {
            display: none;
            position: absolute;
            top: 48px;
            right: 0;
            left: auto;
            width: 280px;
            max-width: 90vw;
            background-color: var(--card-bg, #1e1e24);
            border: 1px solid var(--border-color, #2a2a35);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 1000;
            padding: 1rem 1rem 4.5rem 1rem;
            overflow-y: auto;
            max-height: 380px;
            box-sizing: border-box;
        }

        @media (min-width: 600px) {
            .tags-dropdown {
                left: 0;
                right: auto;
                width: 320px;
            }
        }

        .tags-dropdown.active { display: block; }

        .tags-dropdown h4 {
            font-size: 0.95rem;
            margin-top: 0;
            margin-bottom: 0.75rem;
            color: var(--text-main, #fff);
            border-bottom: 1px solid var(--border-color, #2a2a35);
            padding-bottom: 0.5rem;
        }

        .tags-list-grid { display: flex; flex-direction: column; gap: 0.5rem; }

        .tags-list-grid label {
            font-size: 0.85rem;
            color: var(--text-secondary, #a0a0ab);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .tags-list-grid input[type="checkbox"] { accent-color: #2825b6; cursor: pointer; }

        .apply-dropdown-btn {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            margin: 0;
            background-color: #2825b6;
            color: white;
            border: none;
            border-top: 1px solid var(--border-color, #2a2a35);
            padding: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }
        .apply-dropdown-btn:hover { opacity: 0.9; }

        .active-tags-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }

        .tag-chip {
            background-color: rgba(40, 37, 182, 0.15);
            color: #2825b6;
            border: 1px solid rgba(40, 37, 182, 0.3);
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .main-content { padding: 2rem 0 3rem 0; }

        .section-header h2 { font-size: 1.5rem; margin: 0 0 0.25rem 0; color: var(--text-main, #fff); }
        .section-subtitle { font-size: 0.85rem; color: var(--text-secondary, #a0a0ab); margin: 0; }

        /* GRID ALINHADO À HOME */
        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        @media (max-width: 600px) {
            .manga-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
            }
        }

        .manga-card {
            background: var(--card-bg, #1e1e24);
            border: 1px solid var(--border-color, #2a2a35);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, border-color 0.2s;
        }
        .manga-card:hover { border-color: #2825b6; transform: translateY(-4px); }

        .card-cover { position: relative; width: 100%; aspect-ratio: 2/3; background-color: #2a2a35; }
        .card-cover img { width: 100%; height: 100%; object-fit: cover; }

        .card-rating {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.75);
            color: #facc15;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .card-details { display: flex; flex-direction: column; gap: 0.2rem; padding: 0.9rem; flex: 1; }
        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0;
            color: var(--text-main, #fff);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-chapters { font-size: 0.8rem; color: #2825b6; font-weight: 600; margin-top: auto; }
        .home-btn { color: var(--text-main, #fff); display: flex; align-items: center; justify-content: center; }

        footer {
            text-align: center;
            padding: 2rem 0;
            margin-top: auto;
            border-top: 1px solid var(--border-color, #2a2a35);
            color: var(--text-muted, #80808a);
            font-size: 0.9rem;
            background-color: var(--card-bg, #1e1e24);
        }
        footer a { color: var(--text-secondary, #a0a0ab); text-decoration: none; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <div class="search-wrapper-flex">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search manhwas...">
                    <svg id="search-btn" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>     
                </div>

                <div style="position: relative;">
                    <button class="filter-toggle-btn" id="filter-menu-btn" title="Filter by Tags">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                    </button>

                    <div class="tags-dropdown" id="tags-dropdown-menu">
                        <h4>Filter by Tags</h4>
                        <div class="tags-list-grid" id="dropdown-tags-container">
                            <span style="font-size: 0.85rem; color: var(--text-secondary);">Loading tags...</span>
                        </div>
                        <button class="apply-dropdown-btn" id="btn-aplicar-dropdown">Apply Filters</button>
                    </div>
                </div>
            </div>

            <div class="user-actions">
                <a href="index.html" class="home-btn" title="Home">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </a>
            </div>
        </div>
    </header>

    <main class="container main-content">
        <div class="section-header">
            <div>
                <h2>Search Results</h2>
                <p class="section-subtitle" id="termo-pesquisado">Type a term or choose tags to search.</p>
                <div class="active-tags-chips" id="chips-container"></div>
            </div>
        </div>

        <div class="manga-grid" id="resultado-grid"></div>
    </main>

    <script>
        const supabaseUrl = "https://espwjxbeofclgvqaeuvd.supabase.co";
        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzcHdqeGJlb2ZjbGd2cWFldXZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxOTAzMjMsImV4cCI6MjEwNTc2NjMyM30.R2qAJ9T25y8HF5EAr8dVJopC0YYJN-X8CbgZ-e1oV4g";

        const urlParams = new URLSearchParams(window.location.search);
        const termoInicial = urlParams.get('q') || '';
        const tagsUrl = urlParams.get('tags') ? urlParams.get('tags').split(',') : [];

        const termoElemento = document.getElementById('termo-pesquisado');
        const gridResultados = document.getElementById('resultado-grid');
        const searchInputPage = document.getElementById('search-input');
        const searchBtnPage = document.getElementById('search-btn');
        const filterMenuBtn = document.getElementById('filter-menu-btn');
        const tagsDropdownMenu = document.getElementById('tags-dropdown-menu');
        const chipsContainer = document.getElementById('chips-container');

        filterMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            tagsDropdownMenu.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!tagsDropdownMenu.contains(e.target) && !filterMenuBtn.contains(e.target)) {
                tagsDropdownMenu.classList.remove('active');
            }
        });

        if (searchInputPage) {
            searchInputPage.value = termoInicial;
            searchInputPage.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') executarPesquisaComTags();
            });
        }

        if (searchBtnPage) {
            searchBtnPage.style.cursor = 'pointer';
            searchBtnPage.addEventListener('click', executarPesquisaComTags);
        }

        document.getElementById('btn-aplicar-dropdown').addEventListener('click', executarPesquisaComTags);

        function executarPesquisaComTags() {
            const textoBusca = searchInputPage.value.trim();
            const tagsSelecionadas = Array.from(document.querySelectorAll('input[name="tag-filter"]:checked'))
                                          .map(el => el.value);

            const params = new URLSearchParams();
            if (textoBusca) params.set('q', textoBusca);
            if (tagsSelecionadas.length > 0) params.set('tags', tagsSelecionadas.join(','));

            window.location.search = params.toString();
        }

        async function carregarTagsAutomaticas() {
            try {
                const resposta = await fetch(`${supabaseUrl}/rest/v1/manhwas?select=tags`, {
                    headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` }
                });
                const dados = await resposta.json();
                const setTagsUnicas = new Set();

                if (Array.isArray(dados)) {
                    dados.forEach(manga => {
                        if (Array.isArray(manga.tags)) {
                            manga.tags.forEach(tag => {
                                if (tag && tag.trim() !== '') setTagsUnicas.add(tag.trim());
                            });
                        }
                    });
                }

                const containerTags = document.getElementById('dropdown-tags-container');
                containerTags.innerHTML = '';

                if (setTagsUnicas.size > 0) {
                    const fragment = document.createDocumentFragment();
                    Array.from(setTagsUnicas).sort().forEach(tag => {
                        const isChecked = tagsUrl.includes(tag) ? 'checked' : '';
                        const label = document.createElement('label');
                        label.innerHTML = `<input type="checkbox" name="tag-filter" value="${tag}" ${isChecked}> ${tag}`;
                        fragment.appendChild(label);
                    });
                    containerTags.appendChild(fragment);
                } else {
                    containerTags.innerHTML = '<span style="font-size: 0.85rem; color: var(--text-secondary);">No tags found.</span>';
                }
            } catch (erro) {
                console.error("Error loading tags:", erro);
            }
        }

        async function carregarManhwas() {
            if (!termoInicial && tagsUrl.length === 0) {
                termoElemento.textContent = "Type a term or choose tags to search.";
                gridResultados.innerHTML = `<p style="color: var(--text-secondary); grid-column: 1 / -1; font-size: 0.9rem;">No search criteria defined.</p>`;
                return;
            }

            let endpoint = `${supabaseUrl}/rest/v1/manhwas?select=*`;
            if (termoInicial) endpoint += `&title=ilike.*${encodeURIComponent(termoInicial)}*`;
            if (tagsUrl.length > 0) endpoint += `&tags=ov.{${tagsUrl.join(',')}}`;

            if (tagsUrl.length > 0) {
                chipsContainer.innerHTML = '';
                const fragmentChips = document.createDocumentFragment();
                tagsUrl.forEach(t => {
                    const chip = document.createElement('span');
                    chip.className = 'tag-chip';
                    chip.textContent = `#${t}`;
                    fragmentChips.appendChild(chip);
                });
                chipsContainer.appendChild(fragmentChips);
            }

            termoElemento.textContent = "Showing filtered results";
            gridResultados.innerHTML = '<p style="color: var(--text-secondary); grid-column: 1 / -1;">Searching...</p>';

            try {
                const [respManhwas, respChapters] = await Promise.all([
                    fetch(endpoint, {
                        headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}`, 'Content-Type': 'application/json' }
                    }),
                    fetch(`${supabaseUrl}/rest/v1/chapters?select=manhwa_id`, {
                        headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}`, 'Content-Type': 'application/json' }
                    })
                ]);

                const resultados = await respManhwas.json();
                let todosCapitulos = [];
                try {
                    todosCapitulos = await respChapters.json();
                } catch (e) {
                    todosCapitulos = [];
                }

                const mapaContagem = {};
                if (Array.isArray(todosCapitulos)) {
                    todosCapitulos.forEach(cap => {
                        if (cap && cap.manhwa_id) {
                            mapaContagem[cap.manhwa_id] = (mapaContagem[cap.manhwa_id] || 0) + 1;
                        }
                    });
                }

                gridResultados.innerHTML = "";

                if (Array.isArray(resultados) && resultados.length > 0) {
                    const fragmentCards = document.createDocumentFragment();

                    resultados.forEach(manga => {
                        const totalCaps = mapaContagem[manga.id] || 0;
                        const textoCapitulos = totalCaps > 0 ? `${totalCaps} ${totalCaps === 1 ? 'Chapter' : 'Chapters'}` : 'No chapters';

                        const card = document.createElement('a');
                        card.href = `details.html?id=${manga.id}`;
                        card.className = 'manga-card';

                        card.innerHTML = `
                            <div class="card-cover">
                                <img src="${manga.cover_url || ''}" alt="${manga.title}" onerror="this.src='assets/default-cover.jpg'">
                                <div class="card-rating">★ ${manga.rating || '0.0'}</div>
                            </div>
                            <div class="card-details">
                                <h3 class="card-title">${manga.title}</h3>
                                <span class="card-chapters">${textoCapitulos}</span>
                            </div>
                        `;
                        fragmentCards.appendChild(card);
                    });

                    gridResultados.appendChild(fragmentCards);
                } else {
                    gridResultados.innerHTML = `<p style="color: var(--text-secondary); grid-column: 1 / -1; font-size: 0.9rem;">No manhwa found.</p>`;
                }
            } catch (erro) {
                console.error("Error communicating with Supabase:", erro);
                gridResultados.innerHTML = `<p style="color: #ff4444; grid-column: 1 / -1; font-size: 0.9rem;">An error occurred while loading data.</p>`;
            }
        }

        carregarTagsAutomaticas().then(carregarManhwas);
    </script>

    <footer>
        <div class="container">
            <p>&copy; 2026 Mangaice. All rights reserved.</p>
            <p>
                <a href="terms.html">Terms of Service</a> • 
                <a href="privacy.html">Privacy Policy</a> • 
                <a href="dmca.html">DMCA</a>
            </p>
        </div>
    </footer>
</body>
</html>
