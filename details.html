
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Dinâmico Base -->
    <title id="meta-title">Mangaice - Read Manhwa Online</title>
    <meta id="meta-desc" name="description" content="Read manhwas and webtoons online on Mangaice with high quality and daily updates.">
    <meta name="keywords" content="manhwa, webtoon, read manhwa online, manga, Mangaice">
    <meta name="robots" content="index, follow">
    <link id="canonical-url" rel="canonical" href="https://mangaice.com/details.html">

    <!-- Open Graph -->
    <meta property="og:type" content="article">
    <meta id="og-url" property="og:url" content="https://mangaice.com/details.html">
    <meta id="og-title" property="og:title" content="Mangaice - Read Online">
    <meta id="og-desc" property="og:description" content="Read manhwas online on Mangaice.">
    <meta id="og-image" property="og:image" content="https://mangaice.com/assets/og-cover.jpg">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta id="twitter-title" name="twitter:title" content="Mangaice - Read Online">
    <meta id="twitter-desc" name="twitter:description" content="Read manhwas online on Mangaice.">
    <meta id="twitter-image" name="twitter:image" content="https://mangaice.com/assets/og-cover.jpg">

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Theme Synchronization -->
    <script>
        (function() {
            var stored = localStorage.getItem('theme-override');

            if (stored) {
                if (stored === 'light') {
                    document.documentElement.classList.add('tema-claro');
                } else {
                    document.documentElement.classList.remove('tema-claro');
                }
            } else {
                if (!window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add('tema-claro');
                } else {
                    document.documentElement.classList.remove('tema-claro');
                }
            }
        })();
    </script>

    <style>
        :root {
            --bg-main: #121216;
            --text-main: #ffffff;
            --text-secondary: #a1a1aa;
            --header-bg: #18181c;
            --card-bg: #18181b;
            --border-color: #27272a;
        }

        html.tema-claro {
            --bg-main: #f4f4f6;
            --text-main: #121216;
            --text-secondary: #555560;
            --header-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: #e2e2e8;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Layout com Capa e Informações */
        .details-header {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .details-cover {
            flex-shrink: 0;
            width: 6rem;
        }

        .details-cover img {
            width: 100%;
            height: 100%;
            aspect-ratio: 0/0;
            object-fit: cover;
            border-radius: 8px;
        }

        .details-main-info {
            flex-grow: 1;
            min-width: 0;
        }

        .details-main-info h1 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 8px;
            line-height: 1.3;
            word-break: break-word;
        }

        @media (min-width: 768px) {
            .details-cover {
                width: 200px;
            }

            .details-main-info h1 {
                font-size: 1.8rem;
            }
        }

        /* Cabeçalho dos capítulos */
        .chapters-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 24px 0 12px 0;
        }

        .chapters-header-bar h3 {
            margin: 0;
            font-size: 1.15rem;
            color: var(--text-main);
        }

        .btn-sort-chapters {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .btn-sort-chapters:hover {
            border-color: #2825b6;
        }

        /* Recomendações */
        .recommendations-section {
            margin-top: 2.5rem;
            margin-bottom: 2rem;
        }

        .recommendations-section h3 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: var(--text-main);
            border-left: 4px solid #2825b6;
            padding-left: 10px;
        }

        .recommendations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 160px));
            justify-content: start;
            gap: 16px;
        }

        @media (max-width: 480px) {
            .recommendations-grid {
                justify-content: center;
            }
        }

        .rec-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .rec-card:hover {
            transform: translateY(-4px);
            border-color: #2825b6;
        }

        .rec-card-img-container {
            position: relative;
            width: 100%;
            height: 210px;
            background-color: var(--border-color);
        }

        .rec-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Estrela dos cards: permanece amarela */
        .rec-badge-rating {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: rgba(0, 0, 0, 0.75);
            color: #fbbf24;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            backdrop-filter: blur(4px);
        }

        .rec-card-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .rec-card-title {
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text-main);
        }

        .rec-card-chapters {
            font-size: 0.75rem;
            color: #2825b6;
            font-weight: 600;
            margin-top: auto;
        }

        /* Botão ver mais capítulos */
        .btn-ver-mais-capitulos {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 16px 0;
            background-color: var(--card-bg);
            border: 1px solid #2825b6;
            color: var(--text-main);
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .btn-ver-mais-capitulos:hover {
            background-color: #2825b6;
            color: #ffffff;
        }

        /* Estatísticas superiores: estrela e olho cinzentos */
        .details-stats {
            display: flex;
            gap: 16px;
            margin-top: 8px;
            font-size: 0.95rem;
        }

        .details-stats .details-rating-stat {
            color: #a1a1aa;
        }

        .details-stats .details-views-stat {
            color: #a1a1aa;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .details-stats .details-views-stat strong {
            color: #a1a1aa;
        }

        /* Ícone SVG do olho */
        .views-eye-icon {
            display: inline-block;
            flex: 0 0 auto;
            vertical-align: middle;
        }

        /* Visualizações dos capítulos */
        .chapter-views-count {
            font-size: 0.82rem;
            color: #a1a1aa;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chapter-views-count .views-eye-icon {
            color: #a1a1aa;
        }

        #chapters-list a {
            background-color: var(--card-bg) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
        }
    </style>
</head>

<body>

    <!-- Cabeçalho -->
    <header class="header">
        <div class="container header-container">

            <a href="index.html" class="logo">Manga<span>ice</span></a>

            <div class="search-box">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const supabaseUrl = "https://espwjxbeofclgvqaeuvd.supabase.co";

        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ0eXAiLCJyb2xlIjoiYW5vbiIsInJlZiI6ImVzcHdqeGJlb2ZjbGd2cWFldXZkIiwiaWF0IjoxNzkwMTkwMzIzLCJleHAiOjIxMDU3NjYzMjN9.R2qAJ9T25y8HF5EAr8dVJopC0YYJN-X8CbgZ-e1oV4g";

        const supabase = createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        const manhwaId = urlParams.get('id');

        let todosCapitulos = [];
        let indicePaginaAtual = 0;
        let ordemAscendente = true;

        const TAMANHO_PAGINA = 20;

        // --- SEO DINÂMICO ---
        async function carregarMetadadosSEO(id) {
            if (!id) return;

            const { data: manga } = await supabase
                .from('manhwas')
                .select('title, synopsis, cover_url')
                .eq('id', id)
                .single();

            if (manga) {
                const pageTitle = `${manga.title} - Read Online | Mangaice`;

                const pageDesc = manga.synopsis
                    ? manga.synopsis.slice(0, 160) + '...'
                    : `Read ${manga.title} online with high quality chapters on Mangaice.`;

                const currentUrl = window.location.href;

                document.title = pageTitle;

                const metaTitle = document.getElementById('meta-title');
                if (metaTitle) metaTitle.innerText = pageTitle;

                const metaDesc = document.getElementById('meta-desc');
                if (metaDesc) metaDesc.setAttribute('content', pageDesc);

                const canonicalUrl = document.getElementById('canonical-url');
                if (canonicalUrl) canonicalUrl.setAttribute('href', currentUrl);

                const ogUrl = document.getElementById('og-url');
                if (ogUrl) ogUrl.setAttribute('content', currentUrl);

                const ogTitle = document.getElementById('og-title');
                if (ogTitle) ogTitle.setAttribute('content', pageTitle);

                const ogDesc = document.getElementById('og-desc');
                if (ogDesc) ogDesc.setAttribute('content', pageDesc);

                if (manga.cover_url) {
                    const ogImg = document.getElementById('og-image');
                    if (ogImg) ogImg.setAttribute('content', manga.cover_url);

                    const twitterImg = document.getElementById('twitter-image');
                    if (twitterImg) twitterImg.setAttribute('content', manga.cover_url);
                }

                const twitterTitle = document.getElementById('twitter-title');
                if (twitterTitle) twitterTitle.setAttribute('content', pageTitle);

                const twitterDesc = document.getElementById('twitter-desc');
                if (twitterDesc) twitterDesc.setAttribute('content', pageDesc);
            }
        }

        // --- CARREGAR CAPÍTULOS ---
        async function loadChapters() {
            const listContainer = document.getElementById('chapters-list');
            const btnVerMais = document.getElementById('btn-ver-mais');
            const btnRead = document.querySelector('.btn-primary');

            if (!manhwaId) {
                if (listContainer) {
                    listContainer.innerHTML = '<p>No manhwa selected.</p>';
                }
                return;
            }

            carregarMetadadosSEO(manhwaId);

            const { data: chapters, error } = await supabase
                .from('chapters')
                .select('id, title, chapter_number, views')
                .eq('manhwa_id', manhwaId)
                .order('chapter_number', { ascending: ordemAscendente });

            if (error || !chapters || chapters.length === 0) {
                if (listContainer) {
                    listContainer.innerHTML =
                        '<p style="color:var(--text-secondary);">No chapters available.</p>';
                }
            } else {
                todosCapitulos = chapters;
                indicePaginaAtual = 0;

                listContainer.innerHTML = '';

                renderizarProximoBlocoCapitulos();

                if (todosCapitulos.length > TAMANHO_PAGINA) {
                    btnVerMais.style.display = 'block';

                    btnVerMais.onclick = () => {
                        renderizarProximoBlocoCapitulos();
                    };
                } else {
                    btnVerMais.style.display = 'none';
                }
            }

            const progressoSalvo = localStorage.getItem(`progresso_manhwa_${manhwaId}`);

            if (btnRead) {
                btnRead.innerHTML = progressoSalvo ? 'Continue' : 'Read';

                btnRead.addEventListener('click', function(e) {
                    e.preventDefault();

                    const progressoAtual = localStorage.getItem(`progresso_manhwa_${manhwaId}`);

                    if (progressoAtual) {
                        const dados = JSON.parse(progressoAtual);

                        window.location.href =
                            `read.html?chapter_id=${dados.chapterId}&scroll=${dados.scrollPercent || 0}`;

                    } else if (chapters && chapters.length > 0) {
                        window.location.href =
                            `read.html?chapter_id=${chapters[0].id}&scroll=0`;

                    } else {
                        alert('No chapters available.');
                    }
                });
            }

            carregarRecomendacoesPorTags(manhwaId);
        }

        // --- RENDERIZAR CAPÍTULOS ---
        function renderizarProximoBlocoCapitulos() {
            const listContainer = document.getElementById('chapters-list');
            const btnVerMais = document.getElementById('btn-ver-mais');

            if (indicePaginaAtual === 0) {
                listContainer.innerHTML = '';
            }

            const inicio = indicePaginaAtual * TAMANHO_PAGINA;
            const fim = inicio + TAMANHO_PAGINA;

            const bloco = todosCapitulos.slice(inicio, fim);

            bloco.forEach(ch => {
                const chapterLink = document.createElement('a');

                chapterLink.href = `read.html?chapter_id=${ch.id}`;

                chapterLink.style.cssText = `
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding: 12px 16px;
                    margin-bottom: 8px;
                    background-color: var(--card-bg);
                    border: 1px solid var(--border-color);
                    border-radius: 8px;
                    color: var(--text-main);
                    text-decoration: none;
                `;

                const title = ch.title
                    ? ch.title
                    : `Chapter ${ch.chapter_number}`;

                const totalViews = ch.views || 0;

                chapterLink.innerHTML = `
                    <div>
                        <strong style="display: block; font-size: 1rem;">
                            ${title}
                        </strong>
                    </div>

                    <div class="chapter-views-count">
                        <svg class="views-eye-icon"
                             xmlns="http://www.w3.org/2000/svg"
                             width="16"
                             height="16"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>

                        ${totalViews}
                    </div>
                `;

                listContainer.appendChild(chapterLink);
            });

            indicePaginaAtual++;

            if (indicePaginaAtual * TAMANHO_PAGINA >= todosCapitulos.length) {
                btnVerMais.style.display = 'none';
            } else {
                btnVerMais.style.display = 'block';
            }
        }

        // --- ORDENAR CAPÍTULOS ---
        window.inverterOrdemCapitulos = function() {
            ordemAscendente = !ordemAscendente;

            todosCapitulos.reverse();

            indicePaginaAtual = 0;

            const btnSort = document.getElementById('btn-sort');

            if (btnSort) {
                btnSort.innerHTML = ordemAscendente
                    ? '⇅ Oldest First'
                    : '⇅ Newest First';
            }

            const listContainer = document.getElementById('chapters-list');

            if (listContainer) {
                listContainer.innerHTML = '';
            }

            renderizarProximoBlocoCapitulos();
        };

        // --- RECOMENDAÇÕES POR TAGS ---
        async function carregarRecomendacoesPorTags(idAtual) {
            const recContainer = document.getElementById('recommendations-grid');

            if (!recContainer) return;

            try {
                const { data: atual } = await supabase
                    .from('manhwas')
                    .select('tags')
                    .eq('id', idAtual)
                    .single();

                if (!atual || !atual.tags || atual.tags.length === 0) {
                    recContainer.innerHTML =
                        '<p style="color:var(--text-secondary); font-size: 0.85rem;">No recommendations available.</p>';
                    return;
                }

                const { data: recomendados } = await supabase
                    .from('manhwas')
                    .select('id, title, cover_url, rating, tags')
                    .neq('id', idAtual)
                    .overlaps('tags', atual.tags)
                    .limit(10);

                if (!recomendados || recomendados.length === 0) {
                    recContainer.innerHTML =
                        '<p style="color:var(--text-secondary); font-size: 0.85rem;">No related recommendations.</p>';
                    return;
                }

                recContainer.innerHTML = '';

                for (const item of recomendados) {
                    const { count } = await supabase
                        .from('chapters')
                        .select('*', { count: 'exact', head: true })
                        .eq('manhwa_id', item.id);

                    const totalCapitulos = count || 0;

                    const textoCapitulos = totalCapitulos > 0
                        ? `${totalCapitulos} ${totalCapitulos === 1 ? 'Chapter' : 'Chapters'}`
                        : 'No Chapters';

                    const card = document.createElement('a');

                    card.href = `details.html?id=${item.id}`;
                    card.className = 'rec-card';

                    card.innerHTML = `
                        <div class="rec-card-img-container">
                            <img src="${item.cover_url || 'https://via.placeholder.com/150x210'}"
                                 alt="${item.title}">

                            <div class="rec-badge-rating">
                                ★ ${item.rating || '0.0'}
                            </div>
                        </div>

                        <div class="rec-card-info">
                            <span class="rec-card-title">${item.title}</span>
                            <span class="rec-card-chapters">${textoCapitulos}</span>
                        </div>
                    `;

                    recContainer.appendChild(card);
                }

            } catch (e) {
                recContainer.innerHTML =
                    '<p style="color:var(--text-secondary); font-size: 0.85rem;">Error loading recommendations.</p>';
            }
        }

        // Iniciar carregamento
        loadChapters();

    </script>

</body>
